<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тетрис</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f1a">
<style>
  :root {
    --bg: #0b0f1a;
    --panel: #141a2b;
    --grid: #1d2740;
    --accent: #4ad6ff;
    --text: #e8eefc;
    --muted: #8492b4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  #app {
    height: 100%;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);
    gap: 10px;
  }
  header {
    width: 100%;
    max-width: 460px;
    display: flex;
    justify-content: space-between;
    align-items: stretch;
    gap: 10px;
  }
  .stat {
    flex: 1;
    background: var(--panel);
    border-radius: 14px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }
  .stat .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
  }
  .stat .value {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 460px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  canvas {
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
    touch-action: none;
    display: block;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(11,15,26,0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 16px;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { margin: 0; font-size: 30px; letter-spacing: 1px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 280px; }
  .btn {
    appearance: none;
    border: none;
    background: linear-gradient(135deg, var(--accent), #6a8bff);
    color: #04121c;
    font-size: 18px;
    font-weight: 700;
    padding: 14px 34px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(74,214,255,0.35);
  }
  .btn:active { transform: scale(0.96); }
  .controls {
    width: 100%;
    max-width: 460px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .ctrl {
    appearance: none;
    border: none;
    background: var(--panel);
    color: var(--text);
    border-radius: 14px;
    padding: 16px 0;
    font-size: 22px;
    font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    cursor: pointer;
  }
  .ctrl:active { background: var(--grid); transform: scale(0.96); }
  .ctrl small { display: block; font-size: 9px; color: var(--muted); margin-top: 2px; letter-spacing: 1px; }
  .hint {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    max-width: 460px;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><span class="label">Счёт</span><span class="value" id="score">0</span></div>
    <div class="stat"><span class="label">Линии</span><span class="value" id="lines">0</span></div>
    <div class="stat"><span class="label">Уровень</span><span class="value" id="level">1</span></div>
  </header>

  <div class="board-wrap">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="ovTitle">ТЕТРИС</h1>
      <p id="ovText">Свайпы влево/вправо — двигать, вниз — ускорить, вверх — повернуть. Свайп быстро вниз — мгновенно уронить.</p>
      <button class="btn" id="startBtn">Играть</button>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl" id="bLeft">◀<small>ВЛЕВО</small></button>
    <button class="ctrl" id="bRotate">⟳<small>ПОВОРОТ</small></button>
    <button class="ctrl" id="bRight">▶<small>ВПРАВО</small></button>
    <button class="ctrl" id="bDrop">⤓<small>УРОНИТЬ</small></button>
  </div>
  <div class="hint">Управляй жестами на поле или кнопками внизу</div>
</div>

<script>
(function () {
  "use strict";

  var COLS = 10, ROWS = 20;
  var canvas = document.getElementById("board");
  var ctx = canvas.getContext("2d");
  var cell = 24; // пересчитывается под экран

  var COLORS = {
    I: "#4ad6ff", O: "#ffd24a", T: "#c46aff",
    S: "#5cf08a", Z: "#ff6a6a", J: "#6a8bff", L: "#ff9f4a"
  };
  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]]
  };
  var TYPES = ["I","O","T","S","Z","J","L"];

  var grid, current, nextType, bag = [];
  var score, lines, level, dropInterval, dropTimer, running, paused, gameOver;
  var lastTime = 0, acc = 0;

  function newGrid() {
    var g = [];
    for (var r = 0; r < ROWS; r++) {
      g.push(new Array(COLS).fill(null));
    }
    return g;
  }

  function refillBag() {
    bag = TYPES.slice();
    for (var i = bag.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = bag[i]; bag[i] = bag[j]; bag[j] = t;
    }
  }
  function nextFromBag() {
    if (bag.length === 0) refillBag();
    return bag.pop();
  }

  function spawn() {
    var type = nextType || nextFromBag();
    nextType = nextFromBag();
    current = {
      type: type,
      cells: SHAPES[type].map(function (c) { return [c[0] + 3, c[1]]; }),
      color: COLORS[type]
    };
    if (collides(current.cells)) {
      endGame();
    }
  }

  function collides(cells) {
    for (var i = 0; i < cells.length; i++) {
      var x = cells[i][0], y = cells[i][1];
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function move(dx, dy) {
    if (!running || paused) return false;
    var moved = current.cells.map(function (c) { return [c[0] + dx, c[1] + dy]; });
    if (!collides(moved)) {
      current.cells = moved;
      return true;
    }
    return false;
  }

  function rotate() {
    if (!running || paused) return;
    if (current.type === "O") return;
    // центр вращения — второй блок фигуры
    var pivot = current.cells[1];
    var rotated = current.cells.map(function (c) {
      var dx = c[0] - pivot[0], dy = c[1] - pivot[1];
      return [pivot[0] - dy, pivot[1] + dx];
    });
    // настенный отскок (wall kick)
    var kicks = [0, -1, 1, -2, 2];
    for (var k = 0; k < kicks.length; k++) {
      var test = rotated.map(function (c) { return [c[0] + kicks[k], c[1]]; });
      if (!collides(test)) { current.cells = test; return; }
    }
  }

  function lockPiece() {
    current.cells.forEach(function (c) {
      if (c[1] >= 0) grid[c[1]][c[0]] = current.color;
    });
    clearLines();
    spawn();
  }

  function clearLines() {
    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(function (v) { return v; })) {
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared > 0) {
      var points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(80, 800 - (level - 1) * 70);
      updateStats();
    }
  }

  function softDrop() {
    if (!move(0, 1)) {
      lockPiece();
    } else {
      score += 1;
      updateStats();
    }
  }

  function hardDrop() {
    if (!running || paused) return;
    var dist = 0;
    while (move(0, 1)) { dist++; }
    score += dist * 2;
    updateStats();
    lockPiece();
  }

  function step(dt) {
    acc += dt;
    if (acc >= dropInterval) {
      acc = 0;
      if (!move(0, 1)) lockPiece();
    }
  }

  function loop(time) {
    if (!running) return;
    var dt = time - lastTime;
    lastTime = time;
    if (!paused) {
      step(dt);
    }
    draw();
    requestAnimationFrame(loop);
  }

  function ghostCells() {
    var cells = current.cells.map(function (c) { return [c[0], c[1]]; });
    while (true) {
      var moved = cells.map(function (c) { return [c[0], c[1] + 1]; });
      if (collides(moved)) break;
      cells = moved;
    }
    return cells;
  }

  function drawCell(x, y, color, alpha) {
    if (y < 0) return;
    var px = x * cell, py = y * cell;
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = color;
    var r = 4;
    roundRect(px + 1, py + 1, cell - 2, cell - 2, r);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    // фон-сетка
    ctx.strokeStyle = "rgba(255,255,255,0.04)";
    ctx.lineWidth = 1;
    for (var x = 0; x <= COLS; x++) {
      ctx.beginPath(); ctx.moveTo(x * cell, 0); ctx.lineTo(x * cell, ROWS * cell); ctx.stroke();
    }
    for (var y = 0; y <= ROWS; y++) {
      ctx.beginPath(); ctx.moveTo(0, y * cell); ctx.lineTo(COLS * cell, y * cell); ctx.stroke();
    }
    // уложенные блоки
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (grid[r][c]) drawCell(c, r, grid[r][c]);
      }
    }
    if (current && running) {
      // призрак
      ghostCells().forEach(function (cl) { drawCell(cl[0], cl[1], current.color, 0.18); });
      // активная фигура
      current.cells.forEach(function (cl) { drawCell(cl[0], cl[1], current.color); });
    }
  }

  var dpr = 1;
  function resize() {
    var wrap = canvas.parentElement;
    var availW = wrap.clientWidth;
    var availH = wrap.clientHeight;
    // подбираем размер клетки под доступную область
    var cw = Math.floor(availW / COLS);
    var ch = Math.floor(availH / ROWS);
    cell = Math.max(10, Math.min(cw, ch));
    var w = cell * COLS, h = cell * ROWS;
    dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function updateStats() {
    document.getElementById("score").textContent = score;
    document.getElementById("lines").textContent = lines;
    document.getElementById("level").textContent = level;
  }

  var overlay = document.getElementById("overlay");
  var ovTitle = document.getElementById("ovTitle");
  var ovText = document.getElementById("ovText");
  var startBtn = document.getElementById("startBtn");

  function startGame() {
    grid = newGrid();
    bag = [];
    nextType = null;
    score = 0; lines = 0; level = 1;
    dropInterval = 800;
    acc = 0;
    running = true; paused = false; gameOver = false;
    updateStats();
    spawn();
    overlay.classList.add("hidden");
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    gameOver = true;
    ovTitle.textContent = "Игра окончена";
    ovText.textContent = "Счёт: " + score + " · Линий: " + lines;
    startBtn.textContent = "Заново";
    overlay.classList.remove("hidden");
  }

  startBtn.addEventListener("click", startGame);

  // Кнопки управления
  function bind(id, fn) {
    var el = document.getElementById(id);
    el.addEventListener("touchstart", function (e) { e.preventDefault(); fn(); }, { passive: false });
    el.addEventListener("click", function (e) { fn(); });
  }
  bind("bLeft", function () { move(-1, 0); });
  bind("bRight", function () { move(1, 0); });
  bind("bRotate", rotate);
  bind("bDrop", hardDrop);

  // Жесты на поле
  var touchStartX = 0, touchStartY = 0, touchStartT = 0, lastStepX = 0, lastStepY = 0, moved = false;
  var THRESH = 24;
  canvas.addEventListener("touchstart", function (e) {
    if (!running) return;
    var t = e.changedTouches[0];
    touchStartX = lastStepX = t.clientX;
    touchStartY = lastStepY = t.clientY;
    touchStartT = performance.now();
    moved = false;
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("touchmove", function (e) {
    if (!running) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - lastStepX;
    var dy = t.clientY - lastStepY;
    // горизонтальное движение пошагово
    if (Math.abs(dx) >= THRESH && Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 1 : -1, 0);
      lastStepX = t.clientX;
      lastStepY = t.clientY;
      moved = true;
    } else if (dy >= THRESH && dy > Math.abs(dx)) {
      softDrop();
      lastStepX = t.clientX;
      lastStepY = t.clientY;
      moved = true;
    }
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("touchend", function (e) {
    if (!running) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    var dt = performance.now() - touchStartT;
    if (!moved && Math.abs(dx) < THRESH && Math.abs(dy) < THRESH && dt < 250) {
      // тап — поворот
      rotate();
    } else if (dy > 60 && dt < 220 && Math.abs(dx) < Math.abs(dy)) {
      // быстрый свайп вниз — мгновенно уронить
      hardDrop();
    }
    e.preventDefault();
  }, { passive: false });

  // Клавиатура (для теста на десктопе)
  document.addEventListener("keydown", function (e) {
    if (!running) {
      if (e.key === "Enter" || e.key === " ") startGame();
      return;
    }
    switch (e.key) {
      case "ArrowLeft": move(-1, 0); break;
      case "ArrowRight": move(1, 0); break;
      case "ArrowDown": softDrop(); break;
      case "ArrowUp": case "x": rotate(); break;
      case " ": e.preventDefault(); hardDrop(); break;
      case "p": paused = !paused; break;
    }
  });

  // Пауза при сворачивании
  document.addEventListener("visibilitychange", function () {
    if (document.hidden && running) paused = true;
  });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function () { setTimeout(resize, 200); });

  // первичная отрисовка
  grid = newGrid();
  resize();
})();
</script>
</body>
</html>
